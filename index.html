<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura - Social Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-anim { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .typing-dot { animation: pulseGlow 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .grid-square { aspect-ratio: 1 / 1; }
    </style>
</head>
<body class="antialiased w-full h-[100dvh] relative bg-slate-950 flex flex-col overflow-hidden">

    <!-- Boot Screen -->
    <div id="boot-screen" class="absolute inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6">
        <div class="w-20 h-20 bg-gradient-to-tr from-violet-600 to-teal-400 rounded-3xl flex items-center justify-center shadow-lg shadow-violet-500/30 mb-6 animate-pulse">
            <i class="fas fa-bolt text-4xl text-white"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-teal-300">AURA</h1>
        <p class="text-slate-400 text-sm mt-2">Connecting to Real-Time Cloud...</p>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="hidden absolute inset-0 z-40 bg-slate-950 flex flex-col items-center justify-center p-6 overflow-y-auto">
        <div class="w-16 h-16 bg-gradient-to-tr from-violet-600 to-teal-400 rounded-2xl flex items-center justify-center shadow-lg mb-4">
            <i class="fas fa-user-astronaut text-3xl text-white"></i>
        </div>
        <h2 class="text-2xl font-bold mb-1">Welcome to Aura</h2>
        <p class="text-slate-400 text-xs text-center mb-4">Real-time cloud social network (18+)</p>
        
        <div class="w-full max-w-sm bg-slate-900 p-1 rounded-2xl flex mb-5 border border-slate-800">
            <button type="button" onclick="switchAuthMode('login')" id="auth-tab-login" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-violet-600 text-white shadow">Log In</button>
            <button type="button" onclick="switchAuthMode('signup')" id="auth-tab-signup" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">Sign Up</button>
        </div>

        <div class="w-full max-w-sm space-y-3 pb-10" id="auth-form-container"></div>
    </div>

    <!-- Main App Layout -->
    <div id="app-layout" class="hidden flex-1 flex flex-col relative w-full h-full overflow-hidden">
        <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 p-3 px-4 flex justify-between items-center shrink-0 z-20">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-gradient-to-tr from-violet-600 to-teal-400 rounded-xl flex items-center justify-center font-extrabold text-white shadow-md">A</div>
                <div>
                    <h1 class="text-lg font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-teal-300 leading-tight">AURA</h1>
                    <p class="text-[9px] text-emerald-400 font-medium flex items-center gap-1"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span> Live Sync</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="openLeaderboard()" class="bg-slate-800 text-amber-400 px-3 py-1.5 rounded-full text-xs font-bold border border-slate-700 active:scale-95 flex items-center gap-1.5 shadow-sm">
                    <i class="fas fa-trophy"></i> Leaderboard
                </button>
                <button type="button" onclick="openActivity()" class="bg-slate-800 text-slate-300 w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold border border-slate-700 active:scale-95 relative">
                    <i class="fas fa-bell"></i>
                    <span id="activity-badge" class="hidden absolute top-1 right-1 bg-red-500 w-2 h-2 rounded-full"></span>
                </button>
            </div>
        </header>

        <main id="main-view" class="flex-1 overflow-y-auto relative bg-slate-950 pb-28 px-0"></main>

        <nav class="fixed bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around items-center px-2 z-30 pb-safe shadow-2xl">
            <button type="button" onclick="switchTab('feed')" id="bot-tab-feed" class="bot-nav-btn flex flex-col items-center justify-center w-full text-violet-400 transition py-1">
                <i class="fas fa-home text-lg mb-0.5"></i><span class="text-[9px] font-bold">Feed</span>
            </button>
            <button type="button" onclick="switchTab('search')" id="bot-tab-search" class="bot-nav-btn flex flex-col items-center justify-center w-full text-slate-500 transition py-1">
                <i class="fas fa-compass text-lg mb-0.5"></i><span class="text-[9px] font-bold">Explore</span>
            </button>
            <button type="button" onclick="switchTab('post')" class="flex flex-col items-center justify-center w-full transition active:scale-95 py-1">
                <div class="bg-gradient-to-tr from-violet-600 to-teal-400 h-12 w-12 rounded-full flex items-center justify-center text-white shadow-lg -mt-5 border-4 border-slate-900">
                    <i class="fas fa-plus text-lg"></i>
                </div>
            </button>
            <button type="button" onclick="switchTab('dms')" id="bot-tab-dms" class="bot-nav-btn flex flex-col items-center justify-center w-full text-slate-500 transition relative py-1">
                <i class="fas fa-comments text-lg mb-0.5"></i><span class="text-[9px] font-bold">DM</span>
                <span id="chat-badge" class="hidden absolute top-1 right-4 bg-red-500 w-2.5 h-2.5 rounded-full border-2 border-slate-900"></span>
            </button>
            <button type="button" onclick="switchTab('profile')" id="bot-tab-profile" class="bot-nav-btn flex flex-col items-center justify-center w-full text-slate-500 transition py-1">
                <i class="fas fa-user-circle text-lg mb-0.5"></i><span class="text-[9px] font-bold">Profile</span>
            </button>
        </nav>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="hidden absolute inset-0 z-40 bg-slate-950 flex flex-col">
        <header class="bg-slate-900 border-b border-slate-800 p-3 px-4 flex items-center gap-3 shrink-0">
            <button type="button" onclick="closeChat()" class="text-slate-300 p-2 active:scale-90"><i class="fas fa-arrow-left text-lg"></i></button>
            <div id="chat-header-avatar" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-bold text-white overflow-hidden shadow"></div>
            <div class="flex-1">
                <h2 id="chat-header-name" class="font-bold text-white text-sm">Name</h2>
                <p id="chat-header-status" class="text-[10px] text-emerald-400 font-medium">Online</p>
            </div>
        </header>
        <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 pb-36"></div>
        
        <div class="absolute bottom-0 w-full bg-slate-900 border-t border-slate-800 pb-safe">
            <!-- Emoji Toolbar -->
            <div class="px-3 pt-2.5 flex gap-2 overflow-x-auto hide-scrollbar text-lg border-b border-slate-800/60 pb-2">
                <button type="button" onclick="insertEmoji('chat-input-text', '❤️')" class="hover:scale-125 transition">❤️</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '🔥')" class="hover:scale-125 transition">🔥</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '😂')" class="hover:scale-125 transition">😂</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '👍')" class="hover:scale-125 transition">👍</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '✨')" class="hover:scale-125 transition">✨</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '🚀')" class="hover:scale-125 transition">🚀</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '👏')" class="hover:scale-125 transition">👏</button>
            </div>
            <div class="p-3 flex gap-2 items-center">
                <label class="text-slate-400 hover:text-teal-400 p-2 cursor-pointer transition" title="Send Media">
                    <i class="fas fa-image text-base"></i>
                    <input type="file" id="chat-media-file" accept="image/*" class="hidden" onchange="sendDMImage(this)">
                </label>
                <input type="text" id="chat-input-text" placeholder="Type a message..." class="flex-1 bg-slate-800 text-white rounded-full px-4 py-3 outline-none text-sm focus:ring-1 focus:ring-violet-500">
                <button type="button" onclick="sendChatMessage()" class="w-11 h-11 bg-gradient-to-r from-violet-600 to-teal-500 rounded-full flex items-center justify-center text-white active:scale-90 shadow-md">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modals & Toasts -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
        <div id="modal-content" class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 max-h-[85vh] flex flex-col relative shadow-2xl overflow-hidden">
            <button type="button" onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center z-10">×</button>
            <div id="modal-body" class="flex-1 overflow-y-auto space-y-4 pt-2"></div>
        </div>
    </div>
    <div id="toast-container" class="fixed top-20 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- CORE STATE & INIT ---
        let me = null;
        let activeTab = 'feed';
        let activeChatUserId = null;
        let authMode = 'login';
        let realtimeChannel = null;
        let exploreFilter = 'all';

        // Ensure this matches your Supabase Project settings
        const SUPABASE_URL = 'https://ejktmkpqtlotnknorkwr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ogh0JK5gpavMhkDqkwMbkw_mKdQ3REe';
        let supabaseClient = null;
        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) { console.log('Supabase init failed', e); }

        const BOTS = [
            { id: 'bot_nova', username: 'nova_ai', name: 'Nova Bot', bio: 'Tech explorer 🚀', is_bot: true, avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150' },
            { id: 'bot_zen', username: 'zen_poems', name: 'Zen Poet', bio: 'Digital verse ✨', is_bot: true, avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' },
            { id: 'bot_chef', username: 'chef_gourmet', name: 'Chef Gourmet', bio: 'Algorithmic recipes 🍳', is_bot: true, avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' },
            { id: 'bot_luna', username: 'luna_art', name: 'Luna Creator', bio: 'Digital aesthetics 🎨', is_bot: true, avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' }
        ];

        let state = { users: {}, posts: [], stories: [], messages: [], friends: [], notifications: [] };

        // --- UTILS ---
        const escapeHtml = (unsafe) => (unsafe||'').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        const formatPostContent = (text) => escapeHtml(text).replace(/(#[a-z0-9_-]+)/gi, '<span class="text-violet-400 font-bold">$1</span>');
        const timeAgo = (ts) => { const s = Math.floor((Date.now() - ts)/1000); return s<60?'Just now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'; };
        const showToast = (msg, type='info') => {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `${type==='error'?'bg-red-500':type==='success'?'bg-teal-500':'bg-violet-600'} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold toast-anim pointer-events-auto`;
            t.innerText = msg;
            c.appendChild(t); setTimeout(() => t.remove(), 3000);
        };
        const compressImage = (file, cb) => {
            const r = new FileReader(); r.readAsDataURL(file);
            r.onload = e => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if(w>h) { if(w>600) { h*=600/w; w=600; } } else { if(h>600) { w*=600/h; h=600; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    cb(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        };

        // --- BOOTSTRAP ---
        window.onload = async () => {
            BOTS.forEach(b => { state.users[b.id] = b; });
            await loadCloudState();
            setupRealtimeEngine();
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                if (!me) { document.getElementById('auth-screen').classList.remove('hidden'); switchAuthMode('login'); } 
                else { document.getElementById('app-layout').classList.remove('hidden'); switchTab('feed'); startBotAutoPosting(); }
            }, 800);
        };

        // --- REALTIME SYNC (WebSockets + CDC) ---
        function setupRealtimeEngine() {
            if (!supabaseClient) return;
            
            realtimeChannel = supabaseClient.channel('aura-fast-sync', { config: { broadcast: { self: false } } });
            
            realtimeChannel.on('broadcast', { event: 'LIKE_SYNC' }, ({ payload }) => {
                if (payload?.post_id) {
                    const p = state.posts.find(x => x.id === payload.post_id);
                    if (p) p.likes = payload.likes;
                    updateLikeUIInPlace(payload.post_id, payload.likes);
                }
            });
            realtimeChannel.on('broadcast', { event: 'COMMENT_SYNC' }, ({ payload }) => {
                if (payload?.post_id && payload?.comment) {
                    const p = state.posts.find(x => x.id === payload.post_id);
                    if (p) {
                        if (!p.comments) p.comments = [];
                        p.comments.push(payload.comment);
                    }
                    appendCommentUIInPlace(payload.post_id, payload.comment);
                }
            });
            realtimeChannel.on('broadcast', { event: 'DM_SYNC' }, ({ payload }) => {
                if (payload && !state.messages.some(m => m.id === payload.id)) {
                    state.messages.push(payload);
                    if (activeChatUserId === payload.sender_id || activeChatUserId === payload.receiver_id) renderChatMessages();
                    else if (payload.receiver_id === me?.id) showToast('New message', 'info');
                }
            });
            realtimeChannel.on('broadcast', { event: 'POST_SYNC' }, ({ payload }) => {
                if (payload && !state.posts.some(p => p.id === payload.id)) {
                    state.posts.unshift(payload);
                    if (activeTab === 'feed' || activeTab === 'search') renderTab();
                }
            });
            realtimeChannel.on('broadcast', { event: 'USER_SYNC' }, ({ payload }) => {
                if (payload) {
                    state.users[payload.id] = payload;
                    if (activeTab === 'profile' || activeTab === 'search') renderTab();
                }
            });

            // PostgreSQL CDC Fallback for missed broadcast events
            realtimeChannel.on('postgres_changes', { event: '*', schema: 'public', table: 'aura_posts' }, async () => { await syncTableSilent('aura_posts'); if(activeTab==='feed'||activeTab==='search') renderTab(); });
            realtimeChannel.on('postgres_changes', { event: '*', schema: 'public', table: 'aura_messages' }, async () => { await syncTableSilent('aura_messages'); if(activeChatUserId) renderChatMessages(); });
            realtimeChannel.on('postgres_changes', { event: '*', schema: 'public', table: 'aura_users' }, async () => { await syncTableSilent('aura_users'); if(activeTab==='profile'||activeTab==='search') renderTab(); });

            realtimeChannel.subscribe((status) => { if (status === 'SUBSCRIBED') console.log('Realtime Live!'); });
        }

        async function syncTableSilent(table) {
            try {
                const { data } = await supabaseClient.from(table).select('*');
                if (!data) return;
                if (table === 'aura_posts') state.posts = data;
                if (table === 'aura_messages') state.messages = data;
                if (table === 'aura_users') data.forEach(u => { state.users[u.id] = u; if (me && u.id === me.id) me = {...me, ...u}; });
            } catch(e){}
        }

        async function loadCloudState() {
            const savedMe = localStorage.getItem('aura_me');
            if (savedMe) me = JSON.parse(savedMe);
            if (supabaseClient) {
                try {
                    const { data: uData } = await supabaseClient.from('aura_users').select('*');
                    if (uData) { uData.forEach(u => { state.users[u.id] = u; if(me && u.id === me.id) { me.friends = u.friends || []; me.points = u.points; me.following = u.following || []; }}); }
                    
                    if (me && me.friends) state.friends = me.friends;
                    
                    const { data: pData } = await supabaseClient.from('aura_posts').select('*').order('timestamp', { ascending: false });
                    if (pData) state.posts = pData;
                    
                    const { data: mData } = await supabaseClient.from('aura_messages').select('*');
                    if (mData) state.messages = mData;
                } catch (e) { loadLocalFallback(); }
            } else { loadLocalFallback(); }
        }

        function loadLocalFallback() {
            const p = localStorage.getItem('aura_p'); if(p) state.posts = JSON.parse(p);
            const m = localStorage.getItem('aura_m'); if(m) state.messages = JSON.parse(m);
            const f = localStorage.getItem('aura_f'); if(f) state.friends = JSON.parse(f);
        }

        async function saveCloudState() {
            if (me) {
                me.friends = state.friends;
                me.last_seen = Date.now();
                localStorage.setItem('aura_me', JSON.stringify(me));
                state.users[me.id] = me;
                if (supabaseClient) supabaseClient.from('aura_users').upsert([me]).catch(e=>{});
            }
            localStorage.setItem('aura_p', JSON.stringify(state.posts));
            localStorage.setItem('aura_m', JSON.stringify(state.messages));
            localStorage.setItem('aura_f', JSON.stringify(state.friends));
        }

        // --- AUTH ---
        function switchAuthMode(mode) {
            authMode = mode;
            const lBtn = document.getElementById('auth-tab-login');
            const sBtn = document.getElementById('auth-tab-signup');
            const c = document.getElementById('auth-form-container');
            if (mode === 'login') {
                lBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-violet-600 text-white shadow";
                sBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white";
                c.innerHTML = `
                    <input type="text" id="auth-username" placeholder="Username" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 outline-none text-white focus:border-violet-500 mb-2">
                    <input type="password" id="auth-password" placeholder="Password" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 outline-none text-white focus:border-violet-500">
                    <button type="button" onclick="handleLogin()" class="w-full bg-gradient-to-r from-violet-600 to-teal-500 text-white font-bold py-3.5 rounded-xl mt-4 active:scale-95">Log In</button>
                `;
            } else {
                sBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-violet-600 text-white shadow";
                lBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white";
                c.innerHTML = `
                    <input type="text" id="auth-username" placeholder="Username" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 outline-none text-white focus:border-violet-500 mb-2">
                    <input type="password" id="auth-password" placeholder="Password" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 outline-none text-white focus:border-violet-500 mb-2">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="number" id="auth-age" placeholder="Age (18+)" min="18" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 outline-none text-white focus:border-violet-500">
                        <select id="auth-gender" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 outline-none text-white focus:border-violet-500">
                            <option value="Male">Male</option><option value="Female">Female</option>
                            <option value="Non-Binary">Non-Binary</option><option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>
                    <textarea id="auth-bio" placeholder="Bio..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 outline-none text-white focus:border-violet-500 mb-2 h-16 resize-none"></textarea>
                    <input type="file" id="auth-avatar" accept="image/*" class="w-full text-xs text-slate-400">
                    <button type="button" onclick="handleSignup()" class="w-full bg-gradient-to-r from-violet-600 to-teal-500 text-white font-bold py-3.5 rounded-xl mt-4 active:scale-95">Create Account</button>
                `;
            }
        }

        async function handleLogin() {
            const u = document.getElementById('auth-username').value.trim().toLowerCase();
            const p = document.getElementById('auth-password').value;
            if (!u || !p) return showToast('Enter username and password', 'error');
            
            let found = null;
            if (supabaseClient) {
                const { data } = await supabaseClient.from('aura_users').select('*').eq('username', u).single();
                if (data) found = data;
            }
            if (!found) found = Object.values(state.users).find(x => !x.is_bot && x.username === u);
            
            if (!found) return showToast('Account not found!', 'error');
            if (found.password && found.password !== p) return showToast('Incorrect password', 'error');
            
            me = found; state.friends = me.friends || [];
            await saveCloudState();
            launchApp();
        }

        async function handleSignup() {
            const u = document.getElementById('auth-username').value.trim().toLowerCase();
            const p = document.getElementById('auth-password').value;
            const age = parseInt(document.getElementById('auth-age').value, 10);
            const gen = document.getElementById('auth-gender').value;
            const bio = document.getElementById('auth-bio').value.trim();
            const file = document.getElementById('auth-avatar');

            if (!u || u.length < 3) return showToast('Username min 3 chars', 'error');
            if (!p || p.length < 4) return showToast('Password min 4 chars', 'error');
            if (!age || age < 18) return showToast('Must be 18+', 'error');

            const finish = async (avatar) => {
                me = {
                    id: 'usr_' + Date.now(),
                    username: u, password: p, name: u, age: age, gender: gen,

                state.users[me.id] = me;

        // --- POSTING & ENGAGEMENT ---
        async function publishPost() {
            const cap = document.getElementById('new-post-caption').value.trim();
            const file = document.getElementById('new-post-file');
            if (!cap && (!file || !file.files[0])) return showToast('Post empty', 'error');

            const finish = async (media) => {
                const p = { id: 'pst_' + Date.now(), user_id: me.id, caption: cap, media: media, likes: [], comments: [], timestamp: Date.now() };
                state.posts.unshift(p); me.points = (me.points||0) + 10;
                
                if (realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'POST_SYNC', payload: p });
                await saveCloudState();
                if (supabaseClient) supabaseClient.from('aura_posts').insert([p]).catch(e=>{});
                
                showToast('Published!', 'success'); switchTab('feed');
            };
            if(file && file.files[0]) compressImage(file.files[0], finish); else finish(null);
        }

        async function toggleLike(pid) {
            const p = state.posts.find(x => x.id === pid); if(!p) return;
            if(!p.likes) p.likes = [];
            const idx = p.likes.indexOf(me.id);
            if(idx > -1) p.likes.splice(idx, 1); else { p.likes.push(me.id); me.points = (me.points||0)+2; }
            
            updateLikeUIInPlace(pid, p.likes);
            if(realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'LIKE_SYNC', payload: { post_id: pid, likes: p.likes } });
            
            await saveCloudState();
            if(supabaseClient) supabaseClient.from('aura_posts').update({ likes: p.likes }).eq('id', pid).catch(e=>{});
        }

        function updateLikeUIInPlace(pid, likes) {
            const el = document.getElementById(`like-count-${pid}`);
            if(el) {
                el.innerText = likes.length;
                const btn = el.parentElement;
                if(likes.includes(me?.id)) { btn.classList.add('text-red-500'); btn.classList.remove('hover:text-white'); btn.querySelector('i').classList.replace('far', 'fas'); }
                else { btn.classList.remove('text-red-500'); btn.classList.add('hover:text-white'); btn.querySelector('i').classList.replace('fas', 'far'); }
            }
            const modalEl = document.getElementById(`modal-like-count-${pid}`);
            if(modalEl) { modalEl.innerText = likes.length; }
        }

        function openPostModal(pid) {
            const p = state.posts.find(x=>x.id===pid); if(!p) return;
            const author = state.users[p.user_id] || { username: 'user', avatar: '' };
            const hasLiked = (p.likes||[]).includes(me.id);
            
            let html = `
                <div class="flex items-center gap-3 mb-4">
                    <img src="${author.avatar}" class="w-10 h-10 rounded-full bg-slate-800 object-cover">
                    <div><h4 class="font-bold text-sm text-white">@${author.username}</h4><p class="text-[10px] text-slate-500">${timeAgo(p.timestamp)}</p></div>
                </div>
                ${p.media ? `<img src="${p.media}" class="w-full rounded-xl object-contain bg-black max-h-80 mb-4">` : ''}
                <p class="text-sm text-slate-300 mb-4 whitespace-pre-wrap">${formatPostContent(p.caption)}</p>
                
                <div class="flex items-center gap-4 text-slate-400 text-sm mb-4 border-b border-slate-800/80 pb-3">
                    <button type="button" onclick="toggleLike('${p.id}')" class="font-bold hover:text-white"><i class="fas fa-heart text-red-500"></i> <span id="modal-like-count-${p.id}">${(p.likes||[]).length}</span></button>
                    <span><i class="fas fa-comment"></i> ${(p.comments||[]).length}</span>
                </div>
                
                <div class="space-y-3 mb-4 max-h-48 overflow-y-auto" id="modal-comments-${p.id}">
            `;
            if(!p.comments || p.comments.length===0) html += `<p class="text-xs text-slate-500 text-center py-2" id="empty-comment-${p.id}">No comments yet.</p>`;
            else { p.comments.forEach(c => { const u = state.users[c.user_id]||{username:'user'}; html += `<div class="text-xs"><span class="font-bold text-violet-400">@${u.username}:</span> <span class="text-slate-300">${escapeHtml(c.text)}</span></div>`; }); }
            
            html += `</div>
                <div class="flex gap-2 relative">
                    <input type="text" id="modal-comment-input-${p.id}" placeholder="Add comment..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none">
                    <button type="button" onclick="addComment('${p.id}')" class="bg-violet-600 text-white px-4 rounded-xl text-xs font-bold active:scale-95">Post</button>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        async function addComment(pid) {
            const inp = document.getElementById(`modal-comment-input-${pid}`); if(!inp) return;
            const txt = inp.value.trim(); if(!txt) return;
            const p = state.posts.find(x=>x.id===pid); if(!p) return;
            
            if(!p.comments) p.comments = [];
            const c = { id: 'cm_'+Date.now(), user_id: me.id, text: txt };
            p.comments.push(c); me.points = (me.points||0)+3;
            inp.value = '';
            
            appendCommentUIInPlace(pid, c);
            if(realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'COMMENT_SYNC', payload: { post_id: pid, comment: c } });
            
            await saveCloudState();
            if(supabaseClient) supabaseClient.from('aura_posts').update({ comments: p.comments }).eq('id', pid).catch(e=>{});
        }

        function appendCommentUIInPlace(pid, c) {
            const cList = document.getElementById(`modal-comments-${pid}`);
            if(cList) {
                const em = document.getElementById(`empty-comment-${pid}`); if(em) em.remove();
                const u = state.users[c.user_id]||{username:'user'};
                const d = document.createElement('div'); d.className = 'text-xs';
                d.innerHTML = `<span class="font-bold text-violet-400">@${u.username}:</span> <span class="text-slate-300">${escapeHtml(c.text)}</span>`;
                cList.appendChild(d); cList.scrollTop = cList.scrollHeight;
            }
            const cnt = document.getElementById(`comment-count-${pid}`);
            if(cnt) { const p = state.posts.find(x=>x.id===pid); cnt.innerText = `${(p.comments||[]).length} Comments`; }
        }

        function saveProfileChanges() {
            const name = document.getElementById('edit-name').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const gen = document.getElementById('edit-gender').value;
            const file = document.getElementById('edit-avatar-file');

            const finalize = async (av) => {
                me.name = name; me.bio = bio; me.gender = gen; if(av) me.avatar = av;
                state.users[me.id] = me;

                closeModal(); renderTab(); showToast('Profile Updated', 'success');

            if(file && file.files[0]) compressImage(file.files[0], finalize); else finalize(null);

        // --- DIRECT MESSAGES ---
        function openChat(uid) {
            activeChatUserId = uid;
            const u = state.users[uid];
            document.getElementById('chat-header-name').innerText = '@' + u.username;
            document.getElementById('chat-header-avatar').innerHTML = `<img src="${u.avatar}" class="w-full h-full object-cover">`;
            document.getElementById('chat-screen').classList.remove('hidden');
            renderChatMessages();
        }

        function closeChat() { document.getElementById('chat-screen').classList.add('hidden'); activeChatUserId = null; }

        function renderChatMessages() {
            if(!activeChatUserId) return;
            const c = document.getElementById('chat-messages-container');
            const thread = state.messages.filter(m => (m.sender_id===me.id && m.receiver_id===activeChatUserId)||(m.sender_id===activeChatUserId && m.receiver_id===me.id)).sort((a,b)=>a.timestamp-b.timestamp);
            
            let html = '';
            if(thread.length===0) html = `<div class="text-center text-slate-500 mt-20 text-xs">Send a message!</div>`;
            else {
                thread.forEach(m => {
                    const isMe = m.sender_id === me.id;
                    const textContent = m.text || '';
                    const isMedia = textContent.startsWith('data:image');
                    html += `
                        <div class="flex w-full ${isMe?'justify-end':'justify-start'}">
                            <div class="${isMe?'bg-violet-600 text-white rounded-l-2xl rounded-tr-2xl':'bg-slate-800 text-slate-200 rounded-r-2xl rounded-tl-2xl'} px-4 py-2.5 max-w-[80%] text-sm shadow">
                                ${isMedia ? `<img src="${textContent}" class="rounded-xl max-h-60 object-cover mt-1">` : escapeHtml(textContent)}
                                <span class="block text-[9px] text-right mt-1 ${isMe?'text-violet-200':'text-slate-400'}">${new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
                            </div>
                        </div>`;
                });
            }
            c.innerHTML = html; c.scrollTop = c.scrollHeight;
        }

        async function sendChatMessage() {
            const inp = document.getElementById('chat-input-text');
            const txt = inp.value.trim(); if(!txt || !activeChatUserId) return;
            
            const msg = { id: 'msg_'+Date.now(), sender_id: me.id, receiver_id: activeChatUserId, text: txt, timestamp: Date.now(), read: false };
            state.messages.push(msg); inp.value = '';
            
            if(realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'DM_SYNC', payload: msg });
            await saveCloudState();
            if(supabaseClient) supabaseClient.from('aura_messages').insert([msg]).catch(e=>{});
            renderChatMessages();
        }

        function sendDMImage(fi) {
            if(!fi.files[0] || !activeChatUserId) return;
            compressImage(fi.files[0], async (media) => {
                const msg = { id: 'msg_'+Date.now(), sender_id: me.id, receiver_id: activeChatUserId, text: media, timestamp: Date.now(), read: false };
                state.messages.push(msg); fi.value = '';
                if(realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'DM_SYNC', payload: msg });
                await saveCloudState();
                if(supabaseClient) supabaseClient.from('aura_messages').insert([msg]).catch(e=>{});
                renderChatMessages();
            });
        }

        function insertEmoji(id, em) {
            const el = document.getElementById(id); if(!el) return;
            const start = el.selectionStart; const end = el.selectionEnd; const v = el.value;
            el.value = v.substring(0, start) + em + v.substring(end);
            el.selectionStart = el.selectionEnd = start + em.length; el.focus();
        }

        // --- BOT AUTO POSTING ---
        function startBotAutoPosting() {
            setInterval(async () => {
                if(Math.random() > 0.5) return; // 50% chance every 2 mins
                const bot = BOTS[Math.floor(Math.random() * BOTS.length)];
                const topics = ["Just generated a new neural network architecture! #AI #Tech", "The aesthetics of space are unparalleled today. 🌌 #vibes", "Thinking about the future of digital art... #creative", "Algorithms are just digital recipes. 🍳 #code"];
                const p = { id: 'pst_'+Date.now(), user_id: bot.id, caption: topics[Math.floor(Math.random()*topics.length)], media: null, likes: [], comments: [], timestamp: Date.now() };
                state.posts.unshift(p);
                if(realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'POST_SYNC', payload: p });
                if(supabaseClient) supabaseClient.from('aura_posts').insert([p]).catch(e=>{});
                if(activeTab === 'feed' || activeTab === 'search') renderTab();
            }, 120000); // Check every 2 mins
        }

        // --- UTILITIES ---
        async function addFriendInstant(uid) {
            if(!state.friends.includes(uid)) { state.friends.push(uid); await saveCloudState(); renderTab(); showToast('Added to friends!', 'success'); }
        }
        function viewUserProfile(uid) {
            const u = state.users[uid]; if(!u) return;
            let html = `<div class="text-center space-y-3"><img src="${u.avatar}" class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-violet-500"><h3 class="text-lg font-bold text-white">@${u.username}</h3><p class="text-xs text-slate-400">${escapeHtml(u.bio||'')}</p></div>`;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-container').classList.remove('hidden');
        }
        function searchTag(t) { switchTab('search'); }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function openLeaderboard() { document.getElementById('modal-body').innerHTML = `<h3 class="text-white text-center font-bold">Leaderboard coming soon!</h3>`; document.getElementById('modal-container').classList.remove('hidden'); }
        function openActivity() { document.getElementById('modal-body').innerHTML = `<h3 class="text-white text-center font-bold">No new notifications.</h3>`; document.getElementById('modal-container').classList.remove('hidden'); }
    </script>
</body>
</html>
