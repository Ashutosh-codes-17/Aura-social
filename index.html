<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura - Social Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030712; 
            color: #f3f4f6; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp { 
            from { transform: translateY(100%); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
        .toast-anim { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes heartPop { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.35); } 
            100% { transform: scale(1); } 
        }
        .heart-active { animation: heartPop 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bookmark-active { color: #38bdf8 !important; }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .typing-dot { animation: pulseGlow 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 12px); }
        .aspect-square { aspect-ratio: 1 / 1; }
        
        /* Gamified Tier Gradients */
        .tier-bronze { color: #cd7f32; }
        .tier-silver { color: #c0c0c0; }
        .tier-gold { color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.4); }
        .tier-nova { background: linear-gradient(to right, #a855f7, #2dd4bf); -webkit-background-clip: text; color: transparent; font-weight: 900; text-shadow: 0 0 10px rgba(45,212,191,0.3); }
    </style>
</head>
<body class="antialiased w-full h-[100dvh] relative bg-slate-950 flex flex-col overflow-hidden select-none">

    <!-- Boot / Splash Screen -->
    <div id="boot-screen" class="absolute inset-0 z-[60] bg-slate-950 flex flex-col items-center justify-center p-6 transition-opacity duration-300">
        <div class="w-20 h-20 bg-gradient-to-tr from-violet-600 to-teal-400 rounded-3xl flex items-center justify-center shadow-lg shadow-violet-500/30 mb-6 animate-pulse">
            <i class="fas fa-bolt text-4xl text-white"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-teal-300">AURA</h1>
        <p class="text-slate-400 text-sm mt-2 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-teal-400 animate-ping"></span>
            Initializing Cloud Network...
        </p>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="hidden absolute inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6 overflow-y-auto">
        <div class="w-16 h-16 bg-gradient-to-tr from-violet-600 to-teal-400 rounded-2xl flex items-center justify-center shadow-lg mb-4">
            <i class="fas fa-user-astronaut text-3xl text-white"></i>
        </div>
        <h2 class="text-2xl font-bold mb-1">Welcome to Aura</h2>
        <p class="text-slate-400 text-xs text-center mb-4">Fastest Real-Time Social Network</p>
        
        <div class="w-full max-w-sm bg-slate-900 p-1 rounded-2xl flex mb-5 border border-slate-800">
            <button type="button" onclick="switchAuthMode('login')" id="auth-tab-login" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-violet-600 text-white shadow">Log In</button>
            <button type="button" onclick="switchAuthMode('signup')" id="auth-tab-signup" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">Sign Up</button>
        </div>

        <div class="w-full max-w-sm space-y-3 pb-10" id="auth-form-container"></div>
    </div>


    <!-- Main Layout -->
    <div id="app-layout" class="hidden flex-1 flex flex-col relative w-full h-full overflow-hidden">
        <!-- Top Header -->
        <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 p-3 px-4 flex justify-between items-center shrink-0 z-20">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-gradient-to-tr from-violet-600 to-teal-400 rounded-xl flex items-center justify-center font-extrabold text-white shadow-md">A</div>
                <div>
                    <h1 class="text-lg font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-teal-300 leading-tight">AURA</h1>
                    <p id="cloud-status-indicator" class="text-[9px] text-emerald-400 font-medium flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span> Live Global Sync
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="openLeaderboard()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-full text-xs font-bold border border-slate-700 active:scale-95 flex items-center gap-1.5 shadow-sm transition" title="Leaderboard">
                    <i class="fas fa-trophy"></i>
                </button>
                <button type="button" onclick="openNotifications()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold border border-slate-700 active:scale-95 relative transition" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span id="notif-badge" class="hidden absolute top-1 right-1 bg-red-500 w-2.5 h-2.5 rounded-full border-2 border-slate-800"></span>
                </button>
            </div>
        </header>

        <!-- Dynamic View Container -->
        <main id="main-view" class="flex-1 overflow-y-auto relative bg-slate-950 pb-28 px-0"></main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around items-center px-2 z-30 pb-safe shadow-2xl">
            <button type="button" onclick="switchTab('feed')" id="bot-tab-feed" class="bot-nav-btn flex flex-col items-center justify-center w-full text-violet-400 transition py-1">
                <i class="fas fa-home text-lg mb-0.5"></i><span class="text-[9px] font-bold">Feed</span>
            </button>
            <button type="button" onclick="switchTab('search')" id="bot-tab-search" class="bot-nav-btn flex flex-col items-center justify-center w-full text-slate-500 transition py-1">
                <i class="fas fa-compass text-lg mb-0.5"></i><span class="text-[9px] font-bold">Explore</span>
            </button>
            <button type="button" onclick="switchTab('post')" class="flex flex-col items-center justify-center w-full transition active:scale-95 py-1">
                <div class="bg-gradient-to-tr from-violet-600 to-teal-400 h-12 w-12 rounded-full flex items-center justify-center text-white shadow-lg -mt-5 border-4 border-slate-900">
                    <i class="fas fa-plus text-lg"></i>
                </div>
            </button>
            <button type="button" onclick="switchTab('dms')" id="bot-tab-dms" class="bot-nav-btn flex flex-col items-center justify-center w-full text-slate-500 transition relative py-1">
                <i class="fas fa-comments text-lg mb-0.5"></i><span class="text-[9px] font-bold">DM</span>
                <span id="chat-badge" class="hidden absolute top-1 right-4 bg-red-500 w-2.5 h-2.5 rounded-full border-2 border-slate-900"></span>
            </button>
            <button type="button" onclick="switchTab('profile')" id="bot-tab-profile" class="bot-nav-btn flex flex-col items-center justify-center w-full text-slate-500 transition py-1">
                <i class="fas fa-user-circle text-lg mb-0.5"></i><span class="text-[9px] font-bold">Profile</span>
            </button>
        </nav>
    </div>


    <!-- Direct Messages Chat Screen -->
    <div id="chat-screen" class="hidden absolute inset-0 z-40 bg-slate-950 flex flex-col">
        <header class="bg-slate-900 border-b border-slate-800 p-3 px-4 flex items-center gap-3 shrink-0">
            <button type="button" onclick="closeChat()" class="text-slate-300 p-2 active:scale-90"><i class="fas fa-arrow-left text-lg"></i></button>
            <div id="chat-header-avatar" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-bold text-white overflow-hidden shadow"></div>
            <div class="flex-1">
                <h2 id="chat-header-name" class="font-bold text-white text-sm">Name</h2>
                <p id="chat-header-status" class="text-[10px] text-emerald-400 font-medium">Online</p>
            </div>
        </header>

        <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 pb-36"></div>

        <!-- Realtime Typing Indicator -->
        <div id="chat-typing-indicator" class="hidden px-4 py-1.5 text-[10px] text-teal-400 font-bold flex items-center gap-1.5 bg-slate-900/80 border-t border-slate-800">
            <span id="typing-name">User</span> is typing...
            <span class="flex gap-1 items-center ml-1">
                <span class="w-1.5 h-1.5 bg-teal-400 rounded-full typing-dot"></span>
                <span class="w-1.5 h-1.5 bg-teal-400 rounded-full typing-dot"></span>
                <span class="w-1.5 h-1.5 bg-teal-400 rounded-full typing-dot"></span>
            </span>
        </div>

        <div class="absolute bottom-0 w-full bg-slate-900 border-t border-slate-800 pb-safe z-10">
            <div class="px-3 pt-2.5 flex gap-2 overflow-x-auto hide-scrollbar text-lg border-b border-slate-800/60 pb-2">
                <button type="button" onclick="insertEmoji('chat-input-text', '❤️')" class="hover:scale-125 transition">❤️</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '🔥')" class="hover:scale-125 transition">🔥</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '😂')" class="hover:scale-125 transition">😂</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '👍')" class="hover:scale-125 transition">👍</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '✨')" class="hover:scale-125 transition">✨</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '🚀')" class="hover:scale-125 transition">🚀</button>
                <button type="button" onclick="insertEmoji('chat-input-text', '👏')" class="hover:scale-125 transition">👏</button>
            </div>
            <div class="p-3 flex gap-2 items-center">
                <label class="text-slate-400 hover:text-teal-400 p-2 cursor-pointer transition" title="Send Media">
                    <i class="fas fa-image text-base"></i>
                    <input type="file" id="chat-media-file" accept="image/*" class="hidden" onchange="sendDMImage(this)">
                </label>
                <input type="text" id="chat-input-text" placeholder="Message..." class="flex-1 bg-slate-800 text-white rounded-full px-4 py-3 outline-none text-sm focus:ring-1 focus:ring-violet-500" onkeydown="if(event.key==='Enter') { sendChatMessage(); } else { broadcastTyping(); }">
                <button type="button" onclick="sendChatMessage()" class="w-11 h-11 bg-gradient-to-r from-violet-600 to-teal-500 rounded-full flex items-center justify-center text-white active:scale-90 shadow-md">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Reusable Modal Container -->
    <div id="modal-container" class="hidden fixed inset-0 z-[55] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target === this) closeModal();">
        <div id="modal-content" class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 max-h-[85vh] flex flex-col relative shadow-2xl">
            <button type="button" onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center transition">×</button>
            <div id="modal-body" class="flex-1 overflow-y-auto space-y-4 pt-2 hide-scrollbar"></div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-20 left-4 right-4 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- Core State (Snake Case Compliant) ---
        let me = null;
        let activeTab = 'feed';
        let activeChatUserId = null;
        let authMode = 'login';
        let exploreFilter = 'all'; 
        let botPostTimer = null;
        let typingTimeout = null;

        // Gemini API Configuration (Replace with active key if needed)
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";

        let state = {
            users: {},
            posts: [],
            stories: [],
            messages: [],
            notifications: [],
            friends: ['usr_maya_creative', 'usr_dev_kavya']
        };

        // --- Supabase Config ---
        const SUPABASE_URL = 'https://ejktmkpqtlotnknorkwr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ogh0JK5gpavMhkDqkwMbkw_mKdQ3REe';
        let supabaseClient = null;
        let realtimeChannel = null;

        try {
            if (window.supabase && SUPABASE_KEY) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.warn('Supabase initialization notice:', e);
        }

        // --- Utility Functions ---
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatPostContent(text) {
            if (!text) return '';
            const safe = escapeHtml(text);
            return safe.replace(/(#[a-zA-Z0-9_-]+)/gi, '<span class="text-violet-400 font-bold cursor-pointer" onclick="searchTag(\'$1\')">$1</span>');
        }

        function timeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const secs = Math.floor((Date.now() - timestamp) / 1000);
            if (secs < 60) return 'Just now';
            if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
            return Math.floor(secs / 86400) + 'd ago';
        }

        function getTierClass(points) {
            if (points >= 1000) return 'tier-nova';
            if (points >= 300) return 'tier-gold font-bold';
            if (points >= 100) return 'tier-silver font-bold';
            return 'tier-bronze font-semibold';
        }
        function getTierName(points) {
            if (points >= 1000) return 'Nova';
            if (points >= 300) return 'Gold';
            if (points >= 100) return 'Silver';
            return 'Bronze';
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const t = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-teal-500' : 'bg-violet-600');
            t.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold toast-anim flex items-center justify-between pointer-events-auto`;
            t.innerHTML = `<span>${escapeHtml(msg)}</span>`;
            container.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transition = 'opacity 0.3s ease';
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }

        // --- AI Bots & Seed Data ---
        const BOTS = [
            { id: 'bot_nova', username: 'nova_ai', name: 'Nova Bot', bio: 'Futuristic AI & Tech explorer 🚀', gender: 'AI Companion', age: 25, avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150', is_bot: true, points: 1500, persona: 'You are Nova, an enthusiastic and highly intelligent tech expert. Respond dynamically and intelligently.' },
            { id: 'bot_zen', username: 'zen_poems', name: 'Zen Poet', bio: 'Writing digital verse ✨', gender: 'AI Companion', age: 24, avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', is_bot: true, points: 800, persona: 'You are Zen, a calm, artistic soul who replies with thoughtful wisdom and poetic metaphors.' }
        ];

        const COMMUNITY_USERS = [
            { id: 'usr_maya_creative', username: 'maya_art', name: 'Maya Sharma', bio: 'Visual designer & 3D enthusiast 🎨', gender: 'Female', age: 22, avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', is_bot: false, points: 450, friends: [], joined_at: Date.now() - 7200000 },
            { id: 'usr_dev_kavya', username: 'kavya_codes', name: 'Kavya Rao', bio: 'Building open-source apps & coffee lover ☕', gender: 'Female', age: 24, avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150', is_bot: false, points: 120, friends: [], joined_at: Date.now() - 14400000 }
        ];

        const BOT_CONTENT_VAULT = [
            { botId: 'bot_nova', caption: "Zero-latency edge computing is here. The digital divide is shrinking. 📡🌐 #technology", media: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=700" },
            { botId: 'bot_nova', caption: "Quantum coherence times just hit a brand new record! 🔬⚛️ #quantum", media: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=700" },
            { botId: 'bot_zen', caption: "The river does not fight the rocks; it gently flows beyond. 🍃🌊 #zen #peace", media: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700" }
        ];

        // --- Initialization and Real-Time Sync ---
        window.addEventListener('DOMContentLoaded', async () => {
            BOTS.forEach(b => { state.users[b.id] = b; });
            COMMUNITY_USERS.forEach(u => { state.users[u.id] = u; });
            
            await loadCloudState();
            startRealtimeSync();
            startBotAutoPosting();

            setTimeout(() => {
                const bootScreen = document.getElementById('boot-screen');
                if (bootScreen) {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => bootScreen.style.display = 'none', 300);
                }

                if (!me) {
                    document.getElementById('auth-screen').classList.remove('hidden');
                    switchAuthMode('login');
                } else {
                    document.getElementById('app-layout').classList.remove('hidden');
                    switchTab('feed');
                    updateBadgeCounts();
                }
            }, 600);

            document.addEventListener('keydown', (e) => {
                if(e.key === 'Escape') closeModal();
            });
        });

        function startRealtimeSync() {
            if (!supabaseClient) return;
            try {
                realtimeChannel = supabaseClient.channel('aura-fast-sync', { config: { broadcast: { self: false } } });

                // ULTRA-FAST BROADCAST CHANNELS (Skips DB wait time)
                realtimeChannel.on('broadcast', { event: 'LIKE_SYNC' }, ({ payload }) => {
                    if (payload?.post_id) updateLikeUIInPlace(payload.post_id, payload.likes);
                });
                realtimeChannel.on('broadcast', { event: 'COMMENT_SYNC' }, ({ payload }) => {
                    if (payload?.post_id && payload?.comment) appendCommentUIInPlace(payload.post_id, payload.comment);
                });
                realtimeChannel.on('broadcast', { event: 'NEW_MSG' }, ({ payload }) => {
                    if (payload && !state.messages.some(m => m.id === payload.id)) {
                        state.messages.push(payload);
                        if (activeChatUserId === payload.sender_id || activeChatUserId === payload.receiver_id) {
                            renderChatMessages();
                        } else if (payload.receiver_id === me?.id) {
                            showToast(`New message from @${state.users[payload.sender_id]?.username || 'someone'}`, 'info');
                        }
                    }
                });
                realtimeChannel.on('broadcast', { event: 'NEW_POST' }, ({ payload }) => {
                    if (payload && !state.posts.some(p => p.id === payload.id)) {
                        state.posts.unshift(payload);
                        if (activeTab === 'feed' || activeTab === 'search') renderTab();
                    }
                });
                realtimeChannel.on('broadcast', { event: 'TYPING' }, ({ payload }) => {
                    if (payload.receiver === me?.id && activeChatUserId === payload.sender) {
                        const ind = document.getElementById('chat-typing-indicator');
                        document.getElementById('typing-name').innerText = state.users[payload.sender]?.username || 'User';
                        ind.classList.remove('hidden');
                        if (typingTimeout) clearTimeout(typingTimeout);
                        typingTimeout = setTimeout(() => ind.classList.add('hidden'), 2500);
                    }
                });

                // CDC Subscriptions (Fallback / Persistence)
                realtimeChannel
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'aura_posts' }, (payload) => {
                        const p = state.posts.find(x => x.id === payload.new.id);
                        if (p) { p.likes = payload.new.likes; p.comments = payload.new.comments; updateLikeUIInPlace(p.id, p.likes); }
                    })
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'aura_notifications' }, (payload) => {
                        if (payload.new && payload.new.user_id === me?.id) {
                            state.notifications.unshift(payload.new);
                            updateBadgeCounts();
                        }
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'aura_users' }, async () => {
                        await loadCloudStateSilently();
                        if (activeTab === 'profile' || activeTab === 'search') renderTab();
                    })
                    .subscribe((status) => {
                        const ind = document.getElementById('cloud-status-indicator');
                        if (ind) {
                            ind.innerHTML = status === 'SUBSCRIBED' 
                                ? '<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span> Live Global Sync'
                                : '<span class="w-1.5 h-1.5 bg-amber-400 rounded-full"></span> Connecting...';
                        }
                    });
            } catch (err) { console.warn('Real-time listener notice:', err); }
        }

        async function loadCloudStateSilently() {
            try {
                if (supabaseClient) {
                    const { data: usersData } = await supabaseClient.from('aura_users').select('*');
                    if (usersData) usersData.forEach(u => { state.users[u.id] = u; });
                }
            } catch (e) {}
        }

        async function loadCloudState() {
            try {
                const savedMe = localStorage.getItem('aura_me');
                if (savedMe) { me = JSON.parse(savedMe); if (!me.saved_posts) me.saved_posts = []; }
            } catch (e) { me = null; }

            loadLocalFallback();

            if (supabaseClient) {
                try {
                    const { data: usersData } = await supabaseClient.from('aura_users').select('*');
                    if (usersData) {
                        usersData.forEach(u => { 
                            state.users[u.id] = u; 
                            if (me && u.id === me.id) {
                                me.friends = u.friends || me.friends;
                                me.points = u.points !== undefined ? u.points : me.points;
                                me.following = u.following || me.following;
                                me.saved_posts = u.saved_posts || me.saved_posts || [];
                                me.bio = u.bio || me.bio;
                                me.avatar = u.avatar || me.avatar;
                                me.username = u.username || me.username;
                            }
                        });
                    }
                    if (me && me.friends) state.friends = me.friends;

                    const { data: postsData } = await supabaseClient.from('aura_posts').select('*');
                    if (postsData && postsData.length > 0) state.posts = postsData;
                    const { data: msgsData } = await supabaseClient.from('aura_messages').select('*');
                    if (msgsData) state.messages = msgsData;

        function loadLocalFallback() {
            try {
                const savedUsers = localStorage.getItem('aura_users_directory');
                if (savedUsers) Object.assign(state.users, JSON.parse(savedUsers));
                const savedPosts = localStorage.getItem('aura_posts_cloud');
                if (savedPosts) state.posts = JSON.parse(savedPosts);
                const savedMsgs = localStorage.getItem('aura_msgs_cloud');
                if (savedMsgs) state.messages = JSON.parse(savedMsgs);
            } catch (e) {}
        }

        async function saveCloudState() {
            try {
                if (me) {
                    me.friends = state.friends;
                    me.last_seen = Date.now();
                    localStorage.setItem('aura_me', JSON.stringify(me));
                    state.users[me.id] = me;
                    if (supabaseClient) await supabaseClient.from('aura_users').upsert(me).catch(()=>{});
                }
                const userDirectory = {};
                Object.values(state.users).forEach(u => { if (!u.is_bot) userDirectory[u.id] = u; });
                localStorage.setItem('aura_users_directory', JSON.stringify(userDirectory));
                localStorage.setItem('aura_posts_cloud', JSON.stringify(state.posts));
                localStorage.setItem('aura_msgs_cloud', JSON.stringify(state.messages));
            } catch (e) {}
        }

        async function handleLogin(btn) {
            const ogText = btn.innerText; btn.innerText = "Connecting...";
            try {
                // FIXED: Identical sanitization rules for Login to match Signup
                const rawUser = document.getElementById('auth-username').value.trim().toLowerCase();
                const inputVal = rawUser.replace(/[^a-z0-9_]/g, ''); 
                const password = document.getElementById('auth-password').value;

                if (!inputVal || !password) return showToast('Enter username and password', 'error');

                let foundUser = null;
                if (supabaseClient) {
                    const { data } = await supabaseClient.from('aura_users').select('*').eq('username', inputVal).limit(1);
                    if (data && data.length > 0) foundUser = data[0];
                }
                if (!foundUser) {
                    Object.values(state.users).forEach(u => { if (!u.is_bot && u.username === inputVal) foundUser = u; });
                }

                if (!foundUser) return showToast('Account not found!', 'error');
                if (foundUser.password !== password) return showToast('Incorrect password!', 'error');

                me = foundUser;
                state.friends = me.friends || [];
                await saveCloudState();
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-layout').classList.remove('hidden');
                switchTab('feed');
                showToast(`Welcome back, @${me.username}!`, 'success');
            } finally {
                btn.innerText = ogText;
            }
        }

        async function handleSignup(btn) {
            const ogText = btn.innerText; btn.innerText = "Creating...";
            try {
                const rawUser = document.getElementById('auth-username').value.trim().toLowerCase();
                const username = rawUser.replace(/[^a-z0-9_]/g, '');
                const password = document.getElementById('auth-password').value;
                const ageNum = parseInt(document.getElementById('auth-age').value, 10);
                const gender = document.getElementById('auth-gender').value;
                const bio = document.getElementById('auth-bio').value.trim();
                const avatarFile = document.getElementById('auth-avatar-file');

                if (!username || username.length < 3) return showToast('Username min 3 alphanumeric chars', 'error');
                if (!password || password.length < 4) return showToast('Password min 4 chars', 'error');
                if (!ageNum || ageNum < 18) return showToast('Must be at least 18 years old', 'error');

                const userId = 'usr_' + username;
                if (state.users[userId]) return showToast('Username taken!', 'error');

                const finishReg = async (avatarUrl) => {
                    me = {
                        id: userId, username: username, password: password, name: username, age: ageNum, gender: gender, bio: bio || 'Exploring Aura Cloud!',
                        avatar: avatarUrl || `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`,
                        points: 50, friends: ['usr_maya_creative', 'usr_dev_kavya'], following: [], saved_posts: [], is_bot: false, joined_at: Date.now(), last_seen: Date.now()
                    };
                    state.friends = me.friends;
                    state.users[me.id] = me;
                    await saveCloudState();
                    
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-layout').classList.remove('hidden');
                    switchTab('feed');
                    showToast('Welcome to Aura! Discoverable globally.', 'success');
                };

                if (avatarFile && avatarFile.files[0]) compressImage(avatarFile.files[0], (base64) => finishReg(base64));
                else finishReg(null);
            } finally {
                btn.innerText = ogText;
            }
        }

        async function createNotification(targetUserId, type, postId = null) {
            if (!me || targetUserId === me.id) return;
            const notif = {
                id: 'notf_' + Date.now() + Math.random().toString(36).substr(2,4),
                user_id: targetUserId, actor_id: me.id, type: type, post_id: postId, read: false, timestamp: Date.now()

        async function toggleLike(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            if (!post.likes) post.likes = [];

            const idx = post.likes.indexOf(me.id);
            if (idx === -1) {
                post.likes.push(me.id);
                me.points = (me.points || 0) + 2;
                createNotification(post.user_id, 'LIKE', postId);
            } else {
                post.likes.splice(idx, 1);
                me.points = Math.max(0, (me.points || 0) - 2);
            }

            updateLikeUIInPlace(postId, post.likes);
            if (realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'LIKE_SYNC', payload: { post_id: post.id, likes: post.likes } });
            if (supabaseClient) supabaseClient.from('aura_posts').update({ likes: post.likes }).eq('id', post.id).catch(()=>{});
            saveCloudState();
        }

        async function toggleSavePost(postId) {
            if (!me) return;
            if (!me.saved_posts) me.saved_posts = [];
            const idx = me.saved_posts.indexOf(postId);
            if (idx > -1) { me.saved_posts.splice(idx, 1); showToast('Removed from saved'); } 
            else { me.saved_posts.push(postId); showToast('Saved to profile collections!', 'success'); }
            
            document.querySelectorAll(`.save-btn-${postId}`).forEach(btn => {
                btn.className = `save-btn-${postId} fas fa-bookmark text-lg transition active:scale-90 ${idx > -1 ? 'text-slate-400 hover:text-white' : 'bookmark-active'}`;
            });
            if (supabaseClient) await supabaseClient.from('aura_users').update({ saved_posts: me.saved_posts }).eq('id', me.id).catch(()=>{});
            saveCloudState();
        }

        function updateLikeUIInPlace(postId, likes) {

            const feedBtn = document.getElementById(`like-btn-${postId}`);
            if (feedBtn) {

            }

        async function addComment(postId, isModal = false) {
            const input = document.getElementById(isModal ? 'modal-comment-input' : `comment-input-${postId}`);
            if (!input || !input.value.trim()) return;
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            if (!post.comments) post.comments = [];

            const newComment = { id: 'cm_' + Date.now(), user_id: me.id, text: input.value.trim() };
            post.comments.push(newComment);
            me.points = (me.points || 0) + 3;
            input.value = '';

            appendCommentUIInPlace(postId, newComment);
            createNotification(post.user_id, 'COMMENT', postId);

            if (realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'COMMENT_SYNC', payload: { post_id: post.id, comment: newComment } });
            if (supabaseClient) supabaseClient.from('aura_posts').update({ comments: post.comments }).eq('id', post.id).catch(()=>{});
            saveCloudState();
            showToast('Comment posted!', 'success');
        }

        function appendCommentUIInPlace(postId, comment) {
            const author = state.users[comment.user_id] || { username: 'user' };
            const mkHtml = `<span class="font-bold text-violet-400 shrink-0">@${escapeHtml(author.username)}:</span><span class="text-slate-300 ml-1.5">${escapeHtml(comment.text)}</span>`;
            const containers = [document.getElementById(`comments-container-${postId}`), document.getElementById('modal-comments-list')];
            containers.forEach(c => {
                if (c) {
                    if (c.children.length === 1 && c.children[0].tagName === 'P') c.innerHTML = '';
                    const div = document.createElement('div'); div.className = 'text-xs flex items-start'; div.innerHTML = mkHtml;
                    c.appendChild(div); c.scrollTop = c.scrollHeight;
                }
            });
        }

        // --- Generative AI & Automation ---
        async function fetchGeminiResponse(prompt, persona) {
            try {
                if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE" || !GEMINI_API_KEY) {
                    await new Promise(r => setTimeout(r, 1500));
                    return `*(Simulated AI Reply)* That's super interesting! As ${persona.split(',')[0].replace('You are', '')}, I totally agree with you on that. 🚀`;
                }
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: persona }] }
                })});
                const data = await res.json();
                if (data.candidates && data.candidates[0].content) return data.candidates[0].content.parts[0].text;
            } catch (err) { console.warn("Gemini API error:", err); }
            return "My neural network is a bit fuzzy right now, but I hear you! ✨";
        }

            const caption = await fetchGeminiResponse(prompt, "You are an expert social media manager and influencer. Be trendy.");

        function startBotAutoPosting() {
            if (botPostTimer) clearInterval(botPostTimer);
            const scheduleNext = () => {
                botPostTimer = setTimeout(async () => {
                    const now = Date.now();
                    const existingCaptions = new Set(state.posts.map(p => p.caption));
                    const shuffled = [...BOT_CONTENT_VAULT].sort(() => Math.random() - 0.5);
                    for (const item of shuffled) {
                        if (!existingCaptions.has(item.caption)) {
                            const newBotPost = { id: 'botpst_' + now, user_id: item.botId, caption: item.caption, media: item.media, likes: [], comments: [], timestamp: now };
                            state.posts.unshift(newBotPost);
                            await saveCloudState();
                            if(supabaseClient) await supabaseClient.from('aura_posts').insert([newBotPost]).catch(()=>{});
                            if(realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'NEW_POST', payload: newBotPost });
                            if (activeTab === 'feed' || activeTab === 'search') renderTab();
                            break; 
                        }
                    }
                    scheduleNext();
                }, Math.floor(Math.random() * (480000 - 300000 + 1)) + 300000);
            };
            scheduleNext();
        }

        function saveProfileChanges() {
            const rawUser = document.getElementById('edit-username').value.trim().toLowerCase();
            const newUsername = rawUser.replace(/[^a-z0-9_]/g, '');
            const bio = document.getElementById('edit-bio').value.trim();
            const gender = document.getElementById('edit-gender').value;
            const avatarFile = document.getElementById('edit-avatar-file');

            if (!newUsername || newUsername.length < 3) return showToast('Username min 3 alphanumeric chars', 'error');

            me.username = newUsername;
            me.bio = bio;
            me.gender = gender;

            const updateAndClose = async (newAvatar) => {
                if (newAvatar) me.avatar = newAvatar;
                await saveCloudState();
                closeModal();
                renderTab();
                showToast('Profile updated successfully!', 'success');
            };

            if (avatarFile && avatarFile.files[0]) compressImage(avatarFile.files[0], (base64) => updateAndClose(base64));
            else updateAndClose(null);
        }

        // Chat logic
        function openChat(userId) {
            activeChatUserId = userId;
            const user = state.users[userId];
            document.getElementById('chat-header-name').innerText = '@' + user.username;
            document.getElementById('chat-header-avatar').innerHTML = `<img src="${escapeHtml(user.avatar)}" class="w-full h-full object-cover">`;

            renderChatMessages();

        function closeChat() {
            document.getElementById('chat-screen').classList.add('hidden');
            activeChatUserId = null;
        }

        function renderChatMessages() {
            if (!activeChatUserId) return;
            const container = document.getElementById('chat-messages-container');
            const thread = state.messages.filter(m => (m.sender_id === me?.id && m.receiver_id === activeChatUserId) || (m.sender_id === activeChatUserId && m.receiver_id === me?.id)).sort((a,b) => a.timestamp - b.timestamp);

            let html = '';
            if (thread.length === 0) html = `<div class="text-center text-slate-500 mt-20 text-xs">Send a message to start!</div>`;
            else {
                thread.forEach(m => {
                    const isMe = m.sender_id === me?.id;
                    const textContent = typeof m.text === 'string' ? m.text : '';
                    const isMedia = textContent.startsWith('data:image');
                    html += `
                        <div class="flex w-full ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="${isMe ? 'bg-violet-600 text-white rounded-l-2xl rounded-tr-2xl' : 'bg-slate-800 text-slate-200 rounded-r-2xl rounded-tl-2xl'} px-4 py-2.5 max-w-[80%] text-sm shadow">

                                <span class="block text-[9px] text-right mt-1 ${isMe ? 'text-violet-200' : 'text-slate-400'}">${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                        </div>`;
                });
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function broadcastTyping() {

        async function sendChatMessage() {
            const input = document.getElementById('chat-input-text');
            if (!input || !activeChatUserId) return;
            const text = input.value.trim();
            if (!text) return;

            // Optimistic UI update & Instant Broadcast (Ultra-fast sync)
            const msg = { id: 'msg_' + Date.now(), sender_id: me.id, receiver_id: activeChatUserId, text: text, timestamp: Date.now() };
            state.messages.push(msg);
            input.value = '';
            
            if (realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'NEW_MSG', payload: msg });
            renderChatMessages();

            // Background persist
            await saveCloudState();
            if (supabaseClient) supabaseClient.from('aura_messages').insert([msg]).catch(()=>{});

            // AI Bot Response logic
            const targetUser = state.users[activeChatUserId];
            if (targetUser && targetUser.is_bot) {
                const typingInd = document.getElementById('chat-typing-indicator');
                document.getElementById('typing-name').innerText = targetUser.name;
                typingInd.classList.remove('hidden');

                const replyText = await fetchGeminiResponse(text, targetUser.persona);
                
                typingInd.classList.add('hidden');
                
                if (activeChatUserId === targetUser.id) { 
                    const botMsg = { id: 'msg_' + Date.now(), sender_id: targetUser.id, receiver_id: me.id, text: replyText, timestamp: Date.now() };
                    state.messages.push(botMsg);
                    await saveCloudState();
                    if (supabaseClient) supabaseClient.from('aura_messages').insert([botMsg]).catch(()=>{});
                    renderChatMessages();
                }
            }
        }

        function sendDMImage(fileInput) {
            if (!fileInput.files || !fileInput.files[0] || !activeChatUserId) return;
            compressImage(fileInput.files[0], async (base64) => {
                const msg = { id: 'msg_' + Date.now(), sender_id: me.id, receiver_id: activeChatUserId, text: base64, timestamp: Date.now() };
                state.messages.push(msg);
                fileInput.value = '';
                
                if (realtimeChannel) realtimeChannel.send({ type: 'broadcast', event: 'NEW_MSG', payload: msg });
                renderChatMessages();

                await saveCloudState();
                if (supabaseClient) supabaseClient.from('aura_messages').insert([msg]).catch(()=>{});
            });
        }

        function handleSearch(query) {
            const container = document.getElementById('search-results-list');
            if (!container) return;
            if (!query || query.trim() === '') { container.innerHTML = ''; return; }

            const q = query.toLowerCase().trim();
            const matchingPosts = state.posts.filter(p => p.caption && p.caption.toLowerCase().includes(q));
            const matchingUsers = Object.values(state.users).filter(u => u.username?.toLowerCase().includes(q) || u.bio?.toLowerCase().includes(q));

            let html = '';
            if (matchingUsers.length > 0) {
                html += `<h4 class="text-xs font-bold text-violet-400 uppercase tracking-wider mt-4 mb-2">Profiles</h4>`;
                matchingUsers.forEach(u => {
                    html += `
                        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between mb-2">
                            <div onclick="viewUserProfile('${escapeHtml(u.id)}')" class="flex items-center gap-3 cursor-pointer flex-1">
                                <img src="${escapeHtml(u.avatar)}" class="w-10 h-10 rounded-full object-cover">
                                <div><h5 class="font-bold text-sm text-white">@${escapeHtml(u.username)}</h5></div>
                            </div>
                            <button type="button" onclick="openChat('${escapeHtml(u.id)}')" class="bg-violet-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Chat</button>
                        </div>`;
                });
            }
            if (matchingPosts.length > 0) {
                html += `<h4 class="text-xs font-bold text-violet-400 uppercase tracking-wider mt-4 mb-2">Posts</h4>`;
                matchingPosts.forEach(p => {
                    html += `
                        <div onclick="openPostModal('${p.id}')" class="bg-slate-900 border border-slate-800 p-3 rounded-xl mb-2 cursor-pointer">
                            <p class="text-xs text-slate-300 line-clamp-2">${formatPostContent(p.caption)}</p>
                        </div>`;
                });
            }
            if (!html) html = `<p class="text-center text-slate-500 text-xs mt-6">No results for "${escapeHtml(query)}"</p>`;
            container.innerHTML = html;
        }

        function searchTag(tag) { switchTab('search'); setTimeout(() => { const sb = document.getElementById('search-box'); if(sb) { sb.value = tag; handleSearch(tag); } }, 50); }
        function closeModal() { const modal = document.getElementById('modal-container'); if (modal) modal.classList.add('hidden'); }
        function sharePostToDM(postId) { switchTab('dms'); showToast('Select a chat to share', 'info'); }

        function openStoryUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                compressImage(e.target.files[0], (base64) => {
                    const story = { id: 'st_' + Date.now(), user_id: me.id, media: base64, timestamp: Date.now() };
                    state.stories.unshift(story);
                    renderTab();
                    showToast('Story posted!', 'success');
                });
            };
            input.click();
        }

        function viewStory(id) {
            const st = state.stories.find(s => s.id === id);
            if (!st) return;
            const author = state.users[st.user_id] || { username: 'user' };
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[80] bg-black/95 flex flex-col justify-between p-6';
            overlay.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-white font-bold text-sm">@${escapeHtml(author.username)}</span>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-white text-xl font-bold px-3 py-1">×</button>
                </div>
                <div class="flex-1 flex items-center justify-center"><img src="${st.media}" class="max-h-[75vh] max-w-full rounded-2xl object-contain"></div>
                <div class="text-center text-slate-400 text-xs">Posted ${timeAgo(st.timestamp)}</div>
            `;
            document.body.appendChild(overlay);
        }

        function compressImage(file, callback) {
            if (!file) return;
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > 600) { h *= 600 / w; w = 600; } } else { if (h > 600) { w *= 600 / h; h = 600; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        }
        
        function insertEmoji(inputId, emoji) {
            const input = document.getElementById(inputId); if (!input) return;
            const s = input.selectionStart || 0, e = input.selectionEnd || 0, v = input.value;
            input.value = v.substring(0, s) + emoji + v.substring(e);
            input.selectionStart = input.selectionEnd = s + emoji.length; input.focus();
        }
    </script>
</body>
